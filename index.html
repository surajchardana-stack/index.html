    <!-- Firebase JS SDK (v11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, query, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration & Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shree-malook-veg-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Application State
        window.AppState = {
            currentMode: 'customer', // 'customer' | 'admin'
            activeTab: 'menu',      // 'home' | 'menu' | 'orders' | 'profile' | 'contact'
            user: null,
            adminAuthenticated: false,
            audioEnabled: false,
            alarmAudioCtx: null,
            alarmInterval: null,
            activeAlarmOrderId: null,
            cart: [], // [{ id, name, price, qty }]
            config: {
                isOpen: true,
                closedReason: 'आज Kitchen बंद है। कृपया बाद में order करें।',
                whatsapp: '7339761118',
                phone: '7339761118',
                deliveryRadiusKm: 8,
                minOrderValue: 150,
                deliveryCharge: 30,
                freeDeliveryAbove: 500,
                prepTimeMinutes: 25
            },
            categories: [
                "North Indian", "South Indian", "Chinese", "Snacks", "Rice & Biryani", "Noodles", "Soups", "Beverages", "Desserts", "Special Combo"
            ],
            menu: [],
            orders: [],
            customerProfile: {
                name: "Gaurav Kumar",
                phone: "9876543210",
                address: "Flat 302, Green Valley Apartments, Station Road",
                landmark: "Near Axis Bank ATM",
                lat: 25.2138,
                lng: 75.8648
            },
            filterCategory: 'All',
            searchQuery: ''
        };

        // Firestore Paths (Strict Rule 1 Compliance)
        const getPublicCollectionPath = (collName) => collection(db, 'artifacts', appId, 'public', 'data', collName);
        const getPublicDocPath = (collName, docId) => doc(db, 'artifacts', appId, 'public', 'data', collName, docId);

        async function initAuthAndData() {
            try {
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth initialization fallback to local context:", err);
            }

            onAuthStateChanged(auth, (user) => {
                window.AppState.user = user;
                setupRealtimeListeners();
            });
        }

        // Real-time Firestore Listeners
        function setupRealtimeListeners() {
            // 1. Listen to Restaurant Settings / Config
            onSnapshot(getPublicDocPath('settings', 'config'), (docSnap) => {
                if (docSnap.exists()) {
                    window.AppState.config = { ...window.AppState.config, ...docSnap.data() };
                } else {
                    // Seed initial config
                    setDoc(getPublicDocPath('settings', 'config'), window.AppState.config);
                }
                renderApp();
            }, (err) => console.error("Config Listener Error:", err));

            // 2. Listen to Menu Items
            onSnapshot(getPublicCollectionPath('menu'), (snapshot) => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                if (items.length === 0) {
                    seedDefaultMenu();
                } else {
                    window.AppState.menu = items;
                    renderApp();
                }
            }, (err) => console.error("Menu Listener Error:", err));

            // 3. Listen to Orders
            onSnapshot(getPublicCollectionPath('orders'), (snapshot) => {
                const orders = [];
                let hasNewOrder = false;
                let newOrderId = null;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    orders.push({ id: doc.id, ...data });
                    if (data.status === 'NEW') {
                        hasNewOrder = true;
                        newOrderId = doc.id;
                    }
                });

                // Sort orders by newest first
                orders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                window.AppState.orders = orders;

                // Handle Audio Ring Alarm for Admin on NEW order
                if (hasNewOrder && window.AppState.currentMode === 'admin') {
                    triggerOrderAlarm(newOrderId);
                } else {
                    stopOrderAlarm();
                }

                renderApp();
            }, (err) => console.error("Orders Listener Error:", err));
        }

        // Default Pure Veg Menu Seed
        async function seedDefaultMenu() {
            const seedItems = [
                { name: "Special Shahi Paneer", category: "North Indian", price: 240, description: "Cottage cheese cubes cooked in rich cashew and tomato gravy with pure butter.", available: true, isVeg: true },
                { name: "Dal Makhani (Desi Ghee)", category: "North Indian", price: 210, description: "Overnight slow-cooked black lentils simmered with cream and white butter.", available: true, isVeg: true },
                { name: "Paneer Butter Masala", category: "North Indian", price: 250, description: "Rich & spicy gravy with charred paneer tikka chunks.", available: true, isVeg: true },
                { name: "Veg Manchurian Gravy", category: "Chinese", price: 180, description: "Crispy vegetable balls tossed in dark soy, garlic and ginger sauce.", available: true, isVeg: true },
                { name: "Hakka Noodles Special", category: "Noodles", price: 160, description: "Wok-tossed noodles with crunchy bell peppers, cabbage and spring onion.", available: true, isVeg: true },
                { name: "Masala Dosa (Ghee Roast)", category: "South Indian", price: 140, description: "Crispy rice crepe filled with spiced potato masala, served with sambar & coconut chutney.", available: true, isVeg: true },
                { name: "Paneer Malai Tikka", category: "Snacks", price: 260, description: "Melt-in-mouth cottage cheese marinated in cream, cardamom and yellow chili.", available: true, isVeg: true },
                { name: "Veg Dum Biryani", category: "Rice & Biryani", price: 220, description: "Long grain Basmati rice layered with garden fresh vegetables and aromatic spices.", available: true, isVeg: true },
                { name: "Hot & Sour Veg Soup", category: "Soups", price: 110, description: "Zesty vegetable broth spiced with chili oil and coriander.", available: true, isVeg: true },
                { name: "Mango Lassi (Pure Milk)", category: "Beverages", price: 80, description: "Thick curd lassi infused with natural Alphonso mango pulp.", available: true, isVeg: true },
                { name: "Butter Tandoori Roti", category: "North Indian", price: 25, description: "Whole wheat bread baked in tandoor with fresh butter layer.", available: true, isVeg: true },
                { name: "Gulab Jamun (2 Pcs)", category: "Desserts", price: 70, description: "Warm khoya dumplings soaked in cardamom sugar syrup.", available: true, isVeg: true }
            ];

            for (const item of seedItems) {
                await addDoc(getPublicCollectionPath('menu'), { ...item, createdAt: Date.now() });
            }
        }

        window.toggleAudioAlarmPermission = function() {
            if (!window.AppState.alarmAudioCtx) {
                window.AppState.alarmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (window.AppState.alarmAudioCtx.state === 'suspended') {
                window.AppState.alarmAudioCtx.resume();
            }
            window.AppState.audioEnabled = !window.AppState.audioEnabled;
            const textEl = document.getElementById('sound-text');
            const iconEl = document.getElementById('sound-icon');
            if (window.AppState.audioEnabled) {
                textEl.innerText = 'Audio Alarm Active';
                iconEl.innerText = '🔊';
                playTestBeep();
            } else {
                textEl.innerText = 'Audio Muted';
                iconEl.innerText = '🔇';
                stopOrderAlarm();
            }
        };

        function playTestBeep() {
            if (!window.AppState.alarmAudioCtx) return;
            const osc = window.AppState.alarmAudioCtx.createOscillator();
            const gain = window.AppState.alarmAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, window.AppState.alarmAudioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, window.AppState.alarmAudioCtx.currentTime);
            osc.connect(gain);
            gain.connect(window.AppState.alarmAudioCtx.destination);
            osc.start();
            osc.stop(window.AppState.alarmAudioCtx.currentTime + 0.15);
        }

        function triggerOrderAlarm(orderId) {
            window.AppState.activeAlarmOrderId = orderId;
            if (!window.AppState.audioEnabled) return;
            if (window.AppState.alarmInterval) return; // already ringing

            window.AppState.alarmInterval = setInterval(() => {
                if (!window.AppState.audioEnabled || !window.AppState.activeAlarmOrderId) {
                    stopOrderAlarm();
                    return;
                }
                try {
                    const ctx = window.AppState.alarmAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    window.AppState.alarmAudioCtx = ctx;
                    if (ctx.state === 'suspended') ctx.resume();

                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    // High pitch siren effect for restaurant alert
                    osc.frequency.setValueAtTime(750, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.4);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch (e) {
                    console.error("Audio error", e);
                }
            }, 800);
        }

        function stopOrderAlarm() {
            window.AppState.activeAlarmOrderId = null;
            if (window.AppState.alarmInterval) {
                clearInterval(window.AppState.alarmInterval);
                window.AppState.alarmInterval = null;
            }
        }

        window.switchViewMode = function(mode) {
            window.AppState.currentMode = mode;
            const custBtn = document.getElementById('nav-mode-customer');
            const admBtn = document.getElementById('nav-mode-admin');
            if (mode === 'customer') {
                custBtn.className = "px-3 py-1 rounded text-xs font-semibold bg-veg-600 text-white transition";
                admBtn.className = "px-3 py-1 rounded text-xs font-semibold text-slate-400 hover:text-white transition";
            } else {
                admBtn.className = "px-3 py-1 rounded text-xs font-semibold bg-amber-600 text-white transition";
                custBtn.className = "px-3 py-1 rounded text-xs font-semibold text-slate-400 hover:text-white transition";
            }
            renderApp();
        };

        window.setCustomerTab = function(tab) {
            window.AppState.activeTab = tab;
            renderApp();
        };

        window.setFilterCategory = function(cat) {
            window.AppState.filterCategory = cat;
            renderApp();
        };

        window.handleSearch = function(val) {
            window.AppState.searchQuery = val.toLowerCase();
            renderApp();
        };

        // Cart Actions
        window.addToCart = function(itemId) {
            const item = window.AppState.menu.find(m => m.id === itemId);
            if (!item || !item.available) return;
            const existing = window.AppState.cart.find(c => c.id === itemId);
            if (existing) {
                existing.qty += 1;
            } else {
                window.AppState.cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
            }
            renderApp();
        };

        window.updateCartQty = function(itemId, delta) {
            const idx = window.AppState.cart.findIndex(c => c.id === itemId);
            if (idx > -1) {
                window.AppState.cart[idx].qty += delta;
                if (window.AppState.cart[idx].qty <= 0) {
                    window.AppState.cart.splice(idx, 1);
                }
            }
            renderApp();
        };

        // Admin Actions
        window.toggleRestaurantMasterStatus = async function() {
            const newStatus = !window.AppState.config.isOpen;
            try {
                await setDoc(getPublicDocPath('settings', 'config'), {
                    ...window.AppState.config,
                    isOpen: newStatus
                }, { merge: true });
            } catch(e) {
                alert("Could not update restaurant status. Check connection.");
            }
        };

        window.updateClosedReasonMessage = async function() {
            const msg = prompt("Enter closure message for customers:", window.AppState.config.closedReason);
            if (msg !== null) {
                await setDoc(getPublicDocPath('settings', 'config'), {
                    ...window.AppState.config,
                    closedReason: msg
                }, { merge: true });
            }
        };

        window.toggleMenuItemAvailability = async function(itemId, currentStatus) {
            try {
                await updateDoc(getPublicDocPath('menu', itemId), {
                    available: !currentStatus
                });
            } catch (e) {
                console.error("Error toggling menu item:", e);
            }
        };

        window.openAddMenuItemModal = function() {
            const name = prompt("Enter Veg Dish Name:");
            if (!name) return;
            const price = parseFloat(prompt("Enter Price (₹):", "180"));
            if (isNaN(price)) return;
            const category = prompt(`Enter Category (${window.AppState.categories.join(', ')}):`, "North Indian");
            const description = prompt("Enter Description:", "Fresh veg delicacy cooked in pure butter.");

            addDoc(getPublicCollectionPath('menu'), {
                name,
                price,
                category: category || "Special Items",
                description: description || "Authentic 100% Pure Veg Dish",
                available: true,
                isVeg: true,
                createdAt: Date.now()
            });
        };

        window.deleteMenuItem = async function(itemId) {
            if (confirm("Are you sure you want to delete this dish from the menu?")) {
                const { deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                await deleteDoc(getPublicDocPath('menu', itemId));
            }
        };

        // Order Workflow (Admin)
        window.acceptOrderPrompt = function(orderId) {
            stopOrderAlarm();
            const modalHtml = `
                <div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-slate-800 shadow-2xl">
                        <h3 class="text-xl font-bold text-slate-900 mb-2">🟢 Accept Order</h3>
                        <p class="text-sm text-slate-600 mb-4">Select estimated kitchen preparation time for the customer:</p>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button onclick="confirmAcceptOrder('${orderId}', 15)" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 py-3 rounded-xl font-bold">15 Mins</button>
                            <button onclick="confirmAcceptOrder('${orderId}', 25)" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 py-3 rounded-xl font-bold">25 Mins</button>
                            <button onclick="confirmAcceptOrder('${orderId}', 35)" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 py-3 rounded-xl font-bold">35 Mins</button>
                            <button onclick="confirmAcceptOrder('${orderId}', 45)" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 py-3 rounded-xl font-bold">45 Mins</button>
                        </div>
                        <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold">Cancel</button>
                    </div>
                </div>
            `;
            document.getElementById('modals-container').innerHTML = modalHtml;
        };

        window.confirmAcceptOrder = async function(orderId, prepTime) {
            closeModal();
            try {
                await updateDoc(getPublicDocPath('orders', orderId), {
                    status: 'ACCEPTED',
                    prepTimeMinutes: prepTime,
                    acceptedAt: Date.now()
                });
            } catch (e) {
                alert("Failed to update order status.");
            }
        };

        window.cancelOrderPrompt = function(orderId) {
            stopOrderAlarm();
            const modalHtml = `
                <div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl p-6 max-w-md w-full text-slate-800 shadow-2xl">
                        <h3 class="text-xl font-bold text-red-600 mb-1">🔴 Cancel Order</h3>
                        <p class="text-sm font-medium text-slate-700 mb-4">क्या आप यह order cancel करना चाहते हैं?</p>
                        <p class="text-xs text-slate-500 mb-2">Select cancellation reason:</p>
                        <div class="space-y-2 mb-4">
                            <button onclick="confirmCancelOrder('${orderId}', 'Item unavailable / Out of Stock')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-red-50 hover:border-red-300 text-sm font-medium text-slate-700">❌ Item unavailable / Out of Stock</button>
                            <button onclick="confirmCancelOrder('${orderId}', 'Kitchen too busy / Peak Hour')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-red-50 hover:border-red-300 text-sm font-medium text-slate-700">👨‍🍳 Kitchen too busy</button>
                            <button onclick="confirmCancelOrder('${orderId}', 'Delivery area issue / Staff unavailable')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-red-50 hover:border-red-300 text-sm font-medium text-slate-700">🛵 Delivery partner unavailable</button>
                            <button onclick="confirmCancelOrder('${orderId}', 'Customer requested cancellation')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-red-50 hover:border-red-300 text-sm font-medium text-slate-700">📞 Customer request</button>
                        </div>
                        <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold">Back</button>
                    </div>
                </div>
            `;
            document.getElementById('modals-container').innerHTML = modalHtml;
        };

        window.confirmCancelOrder = async function(orderId, reason) {
            closeModal();
            try {
                await updateDoc(getPublicDocPath('orders', orderId), {
                    status: 'CANCELLED',
                    cancelReason: reason,
                    cancelledAt: Date.now()
                });
            } catch (e) {
                alert("Failed to update order cancellation.");
            }
        };

        window.updateOrderStatus = async function(orderId, nextStatus) {
            try {
                const updateData = { status: nextStatus };
                if (nextStatus === 'OUT_FOR_DELIVERY') {
                    const driverName = prompt("Enter Delivery Boy Name:", "Ramesh Kumar");
                    const driverPhone = prompt("Enter Delivery Boy Phone:", "9876543210");
                    if (driverName) updateData.driverName = driverName;
                    if (driverPhone) updateData.driverPhone = driverPhone;
                }
                if (nextStatus === 'DELIVERED') {
                    updateData.paymentStatus = 'Paid';
                    updateData.deliveredAt = Date.now();
                }
                await updateDoc(getPublicDocPath('orders', orderId), updateData);
            } catch(e) {
                console.error("Failed status update:", e);
            }
        };

        // Checkout Modal & Placement
        window.openCheckoutModal = function() {
            if (window.AppState.cart.length === 0) {
                alert("Your cart is empty! Add delicious Pure Veg dishes first.");
                return;
            }
            if (!window.AppState.config.isOpen) {
                alert("Shree Malook Restaurant is currently CLOSED for new orders.");
                return;
            }

            const subtotal = window.AppState.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const isFreeDelivery = subtotal >= window.AppState.config.freeDeliveryAbove;
            const deliveryCharge = isFreeDelivery ? 0 : window.AppState.config.deliveryCharge;

        window.verifyGPSLocation = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    alert(`✅ GPS Location Verified!\nLatitude: ${pos.coords.latitude.toFixed(4)}, Longitude: ${pos.coords.longitude.toFixed(4)}\nYou are within Shree Malook's delivery zone.`);
                }, () => {
                    alert("📍 Defaulting to Kota City Cloud Kitchen delivery zone.");
                });
            } else {
                alert("Geolocation not supported by browser.");
            }
        };

        window.handlePlaceOrder = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-place-order');
            btn.disabled = true;
            btn.innerText = "Saving Order...";

            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const landmark = document.getElementById('cust-landmark').value;
            const paymentMethod = document.getElementById('cust-payment').value;
            const notes = document.getElementById('cust-notes').value;

            // Server-side / Logic validation calculation
            const items = window.AppState.cart.map(c => ({
                id: c.id,
                name: c.name,
                price: c.price,
                qty: c.qty
            }));

            const subtotal = items.reduce((sum, item) => sum + (item.price * item.qty), 0);
            if (subtotal < window.AppState.config.minOrderValue) {
                alert(`Minimum order value is ₹${window.AppState.config.minOrderValue}. Please add more items.`);
                btn.disabled = false;
                btn.innerText = "PLACE ORDER NOW";
                return;
            }

            const isFree = subtotal >= window.AppState.config.freeDeliveryAbove;
            const deliveryCharge = isFree ? 0 : window.AppState.config.deliveryCharge;
            const total = subtotal + deliveryCharge;

            const orderPayload = {
                orderId: 'SMR-' + Math.floor(100000 + Math.random() * 900000),
                customerName: name,
                customerPhone: phone,
                address: address,
                landmark: landmark,
                paymentMethod: paymentMethod,
                paymentStatus: paymentMethod === 'ONLINE' ? 'Paid' : 'Unpaid (COD)',
                notes: notes || '',
                items: items,
                subtotal: subtotal,
                deliveryCharge: deliveryCharge,
                total: total,
                status: 'NEW',
                createdAt: Date.now()
            };

            try {
                await addDoc(getPublicCollectionPath('orders'), orderPayload);
                // Clear cart
                window.AppState.cart = [];
                closeModal();
                window.AppState.activeTab = 'orders';
                renderApp();
            } catch (err) {
                alert("Order creation failed. Please try again.");
                btn.disabled = false;
                btn.innerText = "PLACE ORDER NOW";
            }
        };

        window.closeModal = function() {
            document.getElementById('modals-container').innerHTML = '';

                    statusBanner.innerHTML = `

                    `;

                document.getElementById('sticky-cart-total').innerText = '₹' + totalCartPrice;

                stickyCart.classList.add('hidden');
            }

            // Dispatch render based on view mode
            if (window.AppState.currentMode === 'customer') {

                            <span class="inline-block mt-1 bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded">Verified Pure Veg Customer</span>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4 space-y-3">
                        <h4 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Saved Delivery Address</h4>
                        <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-xs text-slate-700">
                            <p class="font-bold text-slate-900 mb-1">${window.AppState.customerProfile.address}</p>
                            <p class="text-slate-500">Landmark: ${window.AppState.customerProfile.landmark}</p>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4">
                        <h4 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Shree Malook Kitchen Rules</h4>
                        <ul class="text-xs text-slate-600 space-y-1.5 list-disc pl-4">
                            <li>100% Strictly Pure Vegetarian Kitchen (No Non-Veg or Egg).</li>
                            <li>Separate Kitchen Vessels for Sattvik preparation.</li>
                            <li>Direct Restaurant Delivery within ${window.AppState.config.deliveryRadiusKm} KM radius.</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function renderAdminView() {
            const pendingOrdersCount = window.AppState.orders.filter(o => o.status === 'NEW').length;
            const totalSalesToday = window.AppState.orders.filter(o => o.status === 'DELIVERED').reduce((s, o) => s + o.total, 0);

            return `
                <div class="space-y-6 pb-12">
                    
                    <!-- ADMIN MOBILE TOP SWITCHER & METRICS -->
                    <div class="bg-slate-900 text-white rounded-3xl p-5 shadow-2xl border border-slate-800 space-y-4">
                        <div class="flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <span class="text-[10px] font-black uppercase text-amber-400 tracking-wider">Kitchen Control Center</span>
                                <h2 class="text-xl font-black text-white">RESTAURANT ADMIN MOBILE PORTAL</h2>
                            </div>
                            <!-- MASTER ON/OFF SWITCH BUTTON -->
                            <div class="flex items-center space-x-2">
                                <button onclick="toggleRestaurantMasterStatus()" class="px-5 py-3 rounded-2xl font-black text-xs shadow-lg transition flex items-center space-x-2 ${window.AppState.config.isOpen ? 'bg-emerald-600 hover:bg-emerald-700 text-white animate-pulse' : 'bg-red-600 hover:bg-red-700 text-white'}">
                                    <span>${window.AppState.config.isOpen ? '🟢 RESTAURANT ON' : '🔴 RESTAURANT OFF'}</span>
                                </button>
                                <button onclick="updateClosedReasonMessage()" class="bg-slate-800 text-slate-300 p-2.5 rounded-2xl hover:text-white" title="Edit Closed Message">⚙️</button>
                            </div>
                        </div>

                        <!-- LIVE METRICS DASHBOARD -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                            <div class="bg-slate-800/80 rounded-2xl p-3 border border-slate-700 text-center">
                                <span class="text-2xl font-black ${pendingOrdersCount > 0 ? 'text-red-400 animate-bounce' : 'text-slate-300'}">${pendingOrdersCount}</span>
                                <p class="text-[10px] font-bold text-slate-400 uppercase">🔔 New Alerts</p>
                            </div>
                            <div class="bg-slate-800/80 rounded-2xl p-3 border border-slate-700 text-center">
                                <span class="text-2xl font-black text-amber-400">${window.AppState.orders.filter(o => ['ACCEPTED','PREPARING','READY'].includes(o.status)).length}</span>
                                <p class="text-[10px] font-bold text-slate-400 uppercase">👨‍🍳 Kitchen Active</p>
                            </div>
                            <div class="bg-slate-800/80 rounded-2xl p-3 border border-slate-700 text-center">
                                <span class="text-2xl font-black text-emerald-400">₹${totalSalesToday}</span>
                                <p class="text-[10px] font-bold text-slate-400 uppercase">💰 Today Sales</p>
                            </div>
                            <div class="bg-slate-800/80 rounded-2xl p-3 border border-slate-700 text-center">
                                <span class="text-2xl font-black text-sky-400">${window.AppState.orders.filter(o => o.status === 'DELIVERED').length}</span>
                                <p class="text-[10px] font-bold text-slate-400 uppercase">✅ Delivered</p>
                            </div>
                        </div>
                    </div>

                    <!-- ADMIN ORDERS LIST SECTION -->
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-black text-slate-900 uppercase tracking-wide">
                                Real-time Orders Feed (${window.AppState.orders.length})
                            </h3>
                            <button onclick="openAddMenuItemModal()" class="bg-veg-700 hover:bg-veg-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">
                                + Add Dish
                            </button>
                        </div>

                        ${window.AppState.orders.length === 0 ? `
                            <div class="bg-white rounded-3xl p-8 text-center border border-slate-200">
                                <p class="text-slate-400 text-sm font-bold">No orders received yet. Waiting for incoming customers!</p>
                            </div>
                        ` : window.AppState.orders.map(order => renderAdminOrderCard(order)).join('')}
                    </div>

                    <!-- ADMIN ITEM ON/OFF QUICK MANAGEMENT -->
                    <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-sm font-black text-slate-900 uppercase tracking-wide">
                            Dish Stock ON / OFF Control
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                            ${window.AppState.menu.map(item => `
                                <div class="flex items-center justify-between p-3 rounded-2xl border ${item.available ? 'border-slate-200 bg-slate-50' : 'border-red-200 bg-red-50'}">
                                    <div class="truncate pr-2">
                                        <p class="text-xs font-extrabold text-slate-900 truncate">🟢 ${item.name}</p>
                                        <p class="text-[10px] text-slate-500">₹${item.price} • ${item.category}</p>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <button onclick="toggleMenuItemAvailability('${item.id}', ${item.available})" class="px-2.5 py-1 rounded-xl text-[10px] font-extrabold shadow ${item.available ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}">
                                            ${item.available ? 'AVAILABLE 🟢' : 'SOLD OUT 🔴'}
                                        </button>
                                        <button onclick="deleteMenuItem('${item.id}')" class="text-slate-400 hover:text-red-600 p-1">🗑️</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                </div>
            `;
        }

        /* ADMIN ORDER CARD SPECIFIC FOR MOBILE SCREEN */
        function renderAdminOrderCard(order) {
            const isNew = order.status === 'NEW';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address + ' ' + order.landmark)}`;

            return `
                <div class="bg-white rounded-3xl p-5 border-2 ${isNew ? 'border-red-500 animate-ring-alert shadow-xl' : 'border-slate-200 shadow-sm'} space-y-4">
                    
                    <!-- NEW ORDER HEADER ALERT -->
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-black px-2.5 py-0.5 rounded-full ${isNew ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-100 text-slate-700'}">
                                    ${isNew ? '🔔 NEW ORDER' : order.status}
                                </span>
                                <span class="text-xs font-bold text-slate-400">#${order.orderId}</span>
                            </div>
                            <h4 class="text-lg font-black text-slate-900">${order.customerName}</h4>
                            <p class="text-xs font-bold text-veg-700">📞 ${order.customerPhone}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-black text-slate-900">₹${order.total}</span>
                            <p class="text-[10px] font-extrabold ${order.paymentStatus === 'Paid' ? 'text-emerald-700' : 'text-amber-700'}">${order.paymentMethod} (${order.paymentStatus})</p>
                        </div>
                    </div>

                    <!-- ADDRESS & ACTION MAP BUTTONS -->
                    <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200 text-xs space-y-2">
                        <p class="text-slate-800 font-medium"><strong>Address:</strong> ${order.address}</p>
                        <p class="text-slate-600"><strong>Landmark:</strong> ${order.landmark}</p>
                        ${order.notes ? `<p class="text-amber-800 bg-amber-50 p-1.5 rounded font-bold">Note: ${order.notes}</p>` : ''}
                        
                        <div class="flex gap-2 pt-1">
                            <a href="tel:${order.customerPhone}" class="flex-1 bg-emerald-700 text-white text-center py-2 rounded-xl font-bold text-xs flex justify-center items-center gap-1">
                                📞 Call Customer
                            </a>
                            <a href="${mapUrl}" target="_blank" class="flex-1 bg-sky-600 text-white text-center py-2 rounded-xl font-bold text-xs flex justify-center items-center gap-1">
                                📍 Open Map
                            </a>
                        </div>
                    </div>

                    <!-- ITEMS LIST -->
                    <div class="space-y-1 text-xs text-slate-700 border-t border-b border-slate-100 py-2">
                        ${order.items.map(it => `
                            <div class="flex justify-between font-bold">
                                <span>🟢 ${it.name} x ${it.qty}</span>
                                <span>₹${it.price * it.qty}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- HUGE MOBILE ACCEPT / CANCEL BUTTONS -->
                    ${isNew ? `
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <button onclick="acceptOrderPrompt('${order.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-black text-sm shadow-lg active:scale-95 transition flex justify-center items-center gap-1">
                                <span>🟢 ACCEPT ORDER</span>
                            </button>
                            <button onclick="cancelOrderPrompt('${order.id}')" class="bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-2xl font-black text-sm shadow-lg active:scale-95 transition flex justify-center items-center gap-1">
                                <span>🔴 CANCEL ORDER</span>
                            </button>
                        </div>
                    ` : order.status !== 'DELIVERED' && order.status !== 'CANCELLED' ? `
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${order.status === 'ACCEPTED' ? `
                                <button onclick="updateOrderStatus('${order.id}', 'PREPARING')" class="flex-1 bg-amber-500 text-white py-2.5 rounded-xl font-extrabold text-xs">👨‍🍳 Start Preparing</button>
                            ` : ''}
                            ${order.status === 'PREPARING' ? `
                                <button onclick="updateOrderStatus('${order.id}', 'READY')" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-extrabold text-xs">📦 Mark Ready</button>
                            ` : ''}
                            ${order.status === 'READY' ? `
                                <button onclick="updateOrderStatus('${order.id}', 'OUT_FOR_DELIVERY')" class="flex-1 bg-sky-600 text-white py-2.5 rounded-xl font-extrabold text-xs">🛵 Out for Delivery</button>
                            ` : ''}
                            ${order.status === 'OUT_FOR_DELIVERY' ? `
                                <button onclick="updateOrderStatus('${order.id}', 'DELIVERED')" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-extrabold text-xs">✅ Mark Delivered</button>
                            ` : ''}
                        </div>
                    ` : ''}

                </div>
            `;
        }

        // Initialize App on DOM Load
        window.onload = function() {
            initAuthAndData();
        };
    </script>
</body>
</html>
```
